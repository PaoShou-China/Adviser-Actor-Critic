<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Adviser-Actor-Critic feedback structure</title>
<desc id="desc">Goal and achieved state form an error signal. A PI adviser adjusts the policy goal, while policy output drives the system and returns state feedback.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#355b70"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="#f5f8fa"/>
<text x="54" y="56" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#527080">GOAL-CONDITIONED POLICY WITH CONTROL-THEORETIC ADVISER</text>
<g font-family="Arial,sans-serif">
<rect x="54" y="148" width="194" height="104" rx="12" fill="#fff" stroke="#7394a5" stroke-width="2"/>
<text x="151" y="187" text-anchor="middle" font-size="19" font-weight="700" fill="#183246">Desired goal</text><text x="151" y="222" text-anchor="middle" font-size="23" fill="#1f7381">g</text>
<rect x="54" y="324" width="194" height="104" rx="12" fill="#fff" stroke="#7394a5" stroke-width="2"/>
<text x="151" y="363" text-anchor="middle" font-size="19" font-weight="700" fill="#183246">Achieved state</text><text x="151" y="398" text-anchor="middle" font-size="23" fill="#1f7381">x</text>
<rect x="340" y="224" width="205" height="118" rx="12" fill="#e6f0f4" stroke="#49798e" stroke-width="2"/>
<text x="442" y="263" text-anchor="middle" font-size="19" font-weight="700" fill="#183246">Goal error</text><text x="442" y="301" text-anchor="middle" font-size="22" fill="#183246">e = x − g</text>
<rect x="640" y="224" width="220" height="118" rx="12" fill="#e2f2ef" stroke="#2b877f" stroke-width="2"/>
<text x="750" y="263" text-anchor="middle" font-size="19" font-weight="700" fill="#183246">PI adviser</text><text x="750" y="301" text-anchor="middle" font-size="19" fill="#183246">Δg = Kₚe + Kᵢξ</text>
<rect x="940" y="224" width="206" height="118" rx="12" fill="#fff5e7" stroke="#bc8744" stroke-width="2"/>
<text x="1043" y="263" text-anchor="middle" font-size="19" font-weight="700" fill="#183246">Adjusted goal</text><text x="1043" y="301" text-anchor="middle" font-size="20" fill="#183246">g′ = x − Δg</text>
</g>
<path d="M248 200H297Q316 200 316 219V256H338" fill="none" stroke="#355b70" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M248 376H290Q316 376 316 351V310H338" fill="none" stroke="#355b70" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M545 283H638" fill="none" stroke="#355b70" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M860 283H938" fill="none" stroke="#355b70" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1043 342V475H150V431" fill="none" stroke="#355b70" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<text x="600" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#527080">Position PI and quaternion attitude PI advisories are evaluated with saved goal-conditioned policies.</text>
</svg>