<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Adviser-Actor-Critic evaluation loop</title><desc id="desc">A saved policy receives an observation modified by position and quaternion attitude PI advisers. Its action advances the robotics environment, returning the next state to the evaluation loop.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#173b63"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#f6f9fc"/><path d="M42 83H1158" stroke="#d8e2ec"/>
<text x="54" y="55" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#173b63">EVALUATION ARCHITECTURE · GOAL-CONDITIONED CONTROL</text>
<g font-family="Arial,sans-serif" fill="#122b45">
<rect x="66" y="178" width="190" height="126" rx="12" fill="#fff" stroke="#9aafc3" stroke-width="2"/><text x="161" y="217" text-anchor="middle" font-size="18" font-weight="700">Observation</text><text x="161" y="252" text-anchor="middle" font-size="16">achieved / desired</text><text x="161" y="278" text-anchor="middle" font-size="14" fill="#526b84">state and goal</text>
<rect x="354" y="137" width="226" height="82" rx="12" fill="#eaf1f8" stroke="#597b9e" stroke-width="2"/><text x="467" y="171" text-anchor="middle" font-size="17" font-weight="700">Position PI adviser</text><text x="467" y="197" text-anchor="middle" font-size="15">3D goal correction</text>
<rect x="354" y="263" width="226" height="82" rx="12" fill="#eaf1f8" stroke="#597b9e" stroke-width="2"/><text x="467" y="297" text-anchor="middle" font-size="17" font-weight="700">Attitude PI adviser</text><text x="467" y="323" text-anchor="middle" font-size="15">quaternion goal correction</text>
<rect x="678" y="178" width="190" height="126" rx="12" fill="#fff" stroke="#9aafc3" stroke-width="2"/><text x="773" y="217" text-anchor="middle" font-size="18" font-weight="700">Saved policy</text><text x="773" y="252" text-anchor="middle" font-size="16">deterministic action</text><text x="773" y="278" text-anchor="middle" font-size="14" fill="#526b84">checkpoint loaded</text>
<rect x="967" y="178" width="174" height="126" rx="12" fill="#fff" stroke="#9aafc3" stroke-width="2"/><text x="1054" y="217" text-anchor="middle" font-size="18" font-weight="700">Environment</text><text x="1054" y="252" text-anchor="middle" font-size="16">Gymnasium Robotics</text><text x="1054" y="278" text-anchor="middle" font-size="14" fill="#526b84">episode transition</text>
</g>
<g fill="none" stroke="#173b63" stroke-width="2.4" marker-end="url(#arrow)"><path d="M256 222H326V178H352"/><path d="M326 222V304H352"/><path d="M580 178H627V222H676"/><path d="M580 304H627V260H676"/><path d="M868 241H965"/><path d="M1054 304V421H161V306"/></g>
<circle cx="326" cy="222" r="5" fill="#b32635"/><circle cx="627" cy="241" r="5" fill="#b32635"/>
<text x="600" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526b84">Baseline and adviser configurations are evaluated over seeded episodes; JSON records contain reward, success, distance and ITAE metrics.</text>
<text x="600" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#71869a">The repository evaluates supplied checkpoints; it does not train policies.</text></svg>